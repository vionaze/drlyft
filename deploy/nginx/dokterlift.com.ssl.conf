
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dokterlift.com www.dokterlift.com;

    ssl_certificate     /etc/letsencrypt/live/dokterlift.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dokterlift.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/dokterlift;
    index index.html;
    charset utf-8;
    autoindex off;

    access_log /var/log/nginx/dokterlift.access.log;
    error_log  /var/log/nginx/dokterlift.error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 404 /404.html;
    location = /404.html { internal; }
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~* \.(?:woff2|png|jpe?g|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
}
